name: gi_edge_sim
description: >-
  Simulator of a GI Edge boiler-room controller for the contract stack: it
  activates against GI Core, pushes signed heartbeat and telemetry, polls and
  acknowledges commands like the firmware, and can inject failures.
publish_to: none
environment:
  sdk: ^3.14.0

dependencies:
  crypto: ^3.0.7

dev_dependencies:
  test: ^1.31.2
  very_good_analysis: ^11.0.0
